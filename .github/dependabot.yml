version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch non-major bumps into one PR so weekly maintenance doesn't mean
      # reviewing a dozen single-dependency PRs by hand.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-config-next's bundled eslint-plugin-react still targets the
      # pre-10 ESLint rule context API (context.getFilename), and
      # typescript-eslint's peer range tops out below TS 6.1 — so eslint 10
      # and typescript 7 both break lint/typecheck today. Remove these once
      # eslint-plugin-react and typescript-eslint ship support (see PR that
      # added this note for the incident).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # v9 is a ground-up rewrite (new TableFeatures generic model,
      # createCoreRowModel/createFilteredRowModel replacing
      # getCoreRowModel/getFilteredRowModel, useReactTable replaced by a
      # ReactTable class). None of the app's table components use the new
      # API, so this breaks typecheck outright. Migrating is real, separate
      # work — remove this once that migration happens.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
